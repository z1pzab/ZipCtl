[package]
name = "zipctl"
version = "0.2.0"
edition = "2021"
authors = ["z1pzab"]
description = "Лёгкий TUI + нативный GUI центр управления системой, Git-проектами, сервисами systemd и AI-харнессами для Arch Linux / Hyprland"
license = "MIT"
repository = "https://github.com/z1pzab/ZipCtl"
readme = "README.md"
keywords = ["tui", "gui", "arch-linux", "hyprland", "ratatui", "egui"]
categories = ["command-line-utilities"]
default-run = "zipctl"

[lib]
name = "zipctl"
path = "src/lib.rs"

[[bin]]
name = "zipctl"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
tokio = { version = "1", features = ["rt", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
ureq = "2.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
