[package]
name = "zipctl"
version = "0.2.0"
edition = "2021"
authors = ["z1pzab"]
description = "Лёгкий кроссплатформенный TUI-центр управления системой, Git-проектами, сервисами и AI-харнессами (Windows / Linux)"
license = "MIT"
repository = "https://github.com/z1pzab/ZipCtl"
readme = "README.md"
keywords = ["tui", "cli", "ratatui", "system-monitor", "cross-platform"]
categories = ["command-line-utilities"]
default-run = "zipctl"

[lib]
name = "zipctl"
path = "src/lib.rs"

[[bin]]
name = "zipctl"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "process", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
ureq = "2.12"
dirs = "6"

[target.'cfg(windows)'.dependencies]
arboard = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
